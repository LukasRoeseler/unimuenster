name: Backfill APC Publication Costs

# Temporary, high-frequency companion to the "Crawl per-work publication costs"
# step in refresh-data.yml. That step only gets one shot per week, and the
# institution's full output is ~117k works -- at ~300 requests (60k works) per
# run, catching up from a cold start would otherwise take weeks. This workflow
# runs the same resumable, checkpointed crawler (scripts/crawl-publication-costs.js)
# far more often so the backlog fills in as fast as OpenAlex's rate limits allow.
#
# Once citations-topics/data/publication-costs-progress.json reports
# "done": true, this workflow has nothing left to do -- crawl-publication-costs.js
# switches to a cheap incremental delta fetch automatically, and that's already
# covered by the weekly refresh-data.yml step. At that point, DELETE THIS FILE
# so the pipeline settles back to the once-a-week cadence for everything else.
# (A workflow run can't disable/edit its own workflow file -- the default
# GITHUB_TOKEN is explicitly barred from writing to .github/workflows/ -- so
# this can't turn itself off automatically; it has to be removed by hand once
# the backlog is confirmed complete.)

on:
  schedule:
    # Every 15 minutes. GitHub advises against scheduling much tighter than
    # this (very short intervals are the first thing throttled/dropped under
    # load), and it's already far more often than the crawl needs once the
    # backlog is small -- see the note above about deleting this file.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shared with refresh-data.yml on purpose: both scripts touch
  # citations-topics/data/, so this serializes them instead of letting them
  # race to commit at the same time.
  group: refresh-data
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Crawl per-work publication costs
        id: pubcosts
        continue-on-error: true
        env:
          OA_API_KEY: ${{ secrets.OA_API_KEY }}
        run: node scripts/crawl-publication-costs.js

      - name: Commit updated data
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add citations-topics/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: APC backfill $(date -u '+%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main && git push origin HEAD:main && break
              echo "Push attempt ${attempt} failed; retrying after rebase..."
              sleep 5
            done
          fi

      - name: Report backlog status
        run: |
          node -e "
            const p = require('./citations-topics/data/publication-costs-progress.json');
            const summary = p.done
              ? '**Backlog complete** (' + p.fetchedCount + ' works). Delete .github/workflows/backfill-apc-costs.yml -- the weekly refresh-data.yml step now handles this with a cheap incremental fetch.'
              : 'Backlog in progress: ' + p.fetchedCount + ' of ~' + (p.totalCount || '?') + ' works fetched so far.';
            console.log(summary);
            if (process.env.GITHUB_STEP_SUMMARY) require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          "

      - name: Fail the job if the crawl step failed
        if: steps.pubcosts.outcome == 'failure'
        run: exit 1
